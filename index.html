  var estado=document.getElementById('tf-estado')?document.getElementById('tf-estado').value:'';
  var tipo=document.getElementById('tf-tipo')?document.getElementById('tf-tipo').value:'';
  var pais=document.getElementById('tf-pais')?document.getElementById('tf-pais').value:'';
  var isAg=role==='ag';
  var verPausadas=(estado==='Pausada');
  var nPausadas=TIENDAS.filter(function(t){return t.act===false;}).length;
  var activasList=TIENDAS.filter(function(t){return t.act!==false;});
  var filtered=TIENDAS.filter(function(t){
    if(verPausadas){if(t.act!==false)return false;}
    else if(t.act===false)return false;
    if(buscar&&t.n.toLowerCase().indexOf(buscar)===-1)return false;
    if(estado==='Urgente'&&!t.urg)return false;
    if(estado==='Pendiente'&&t.est!=='Pendiente')return false;
    if(estado==='Al dia'&&t.est!=='Al dia')return false;
    if(tipo==='reg'&&!t.reg)return false;
    if(tipo==='hist'&&!t.hist2)return false;
    if(pais&&t.pais!==pais)return false;
    return true;
  });
  var stats=document.getElementById('tstats');
  var novsbar=document.getElementById('tnovsbar');
  if(stats){
    var totalReg=filtered.reduce(function(s,t){return s+(t.reg||0);},0);
    var totalCas=filtered.reduce(function(s,t){return s+(t.cas||0);},0);
    var totalNov=totalReg+totalCas;
    var nUrg=filtered.filter(function(t){return t.urg;}).length;
    var nPen=filtered.filter(function(t){return t.est==='Pendiente';}).length;
    var nH2=filtered.filter(function(t){return t.hist2;}).length;
    var nAlDia=filtered.filter(function(t){return t.est==='Al dia';}).length;
    var hayFiltro=pais||estado||tipo||buscar;
    var baseN=verPausadas?nPausadas:activasList.length;
    var filLabel=filtered.length<baseN?' <span style="font-size:10px;color:var(--t3)">de '+baseN+'</span>':'';
    stats.innerHTML=
      '<div class="sc" style="border-top:2px solid var(--navy)"><div class="sn">'+filtered.length+filLabel+'</div><div class="sl">Tiendas'+(verPausadas?' pausadas':(hayFiltro?' (filtradas)':' activas'))+'</div></div>'
      +'<div class="sc" style="border-top:2px solid var(--red)"><div class="sn" style="color:var(--red)">'+nUrg+'</div><div class="sl">Urgentes</div></div>'
      +'<div class="sc" style="border-top:2px solid var(--amb)"><div class="sn" style="color:var(--amb)">'+nPen+'</div><div class="sl">Con pendientes</div></div>'
      +'<div class="sc" style="border-top:2px solid var(--gold)"><div class="sn" style="color:var(--gold)">'+nH2+'</div><div class="sl">Con historicas</div></div>'
      +'<div class="sc" style="border-top:2px solid var(--grn)"><div class="sn" style="color:var(--grn)">'+nAlDia+'</div><div class="sl">Al dia</div></div>';
    if(novsbar){
      novsbar.innerHTML=
        '<span style="font-size:12px;color:var(--navy);font-weight:600">Novedades pendientes</span>'
        +'<span style="font-size:12.5px;color:var(--t2)">Pendientes: <strong style="color:var(--navy)">'+totalReg+'</strong></span>'
        +'<span style="font-size:12.5px;color:var(--t2)">CAS abiertos: <strong style="color:var(--red)">'+totalCas+'</strong></span>'
        +(isAg?'':'<button class="btn bsm" style="margin-left:auto" title="Descarga todas las novedades activas (ID, tienda, motivo, fecha) para compararlas con Dropi" onclick="sgnExportNovedades(this)">&#x2B07; Descargar novedades</button>')
        +'<span style="'+(isAg?'margin-left:auto;':'')+'background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px">Total: '+totalNov+'</span>';
    }
  }
  var tbody=document.getElementById('ttbody');
  if(!tbody)return;
  if(filtered.length===0){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--t3);font-size:13px">No hay tiendas que coincidan con los filtros.</td></tr>';return;}
  var rows='';
  filtered.forEach(function(t){
    var rowCls=t.urg?'ru':t.hist2?'rh':'';
    var pbarCls=t.urg?'pbn':t.hist2?'pbg':'pbgn';
    var urgTag=t.urg?'<span class="utag">&#x1F6A9; Urgente</span>':'';
    var noteTag=sgnStoreComments(t.id).length?'<span class="htag" title="Tiene notas especiales">&#x1F4CC; Nota</span>':'';
    var regColor=t.reg>0?'color:var(--red);font-weight:600':'color:var(--t3)';
    var estBadge=t.est==='Urgente'?'br':t.est==='Pendiente'?'bg':'bgn';
    var paisLabel=PAISES[t.pais]||t.pregpais||t.pais;
    var btnHtml='<button class="btn bp bsm" onclick="goTienda('+t.id+')">Gestionar</button>';
    if(!isAg){
      var urgBtn=t.urg
        ?'<button class="btn bsm" onclick="sgnSMo(\'qu\','+t.id+')">Quitar urg.</button>'
        :'<button class="btn br2 bsm" onclick="sgnSMo(\'mu\','+t.id+')">Urgente</button>';
      btnHtml=urgBtn+btnHtml+'<button class="btn bgo bsm" onclick="goAnl('+t.id+')">Analizar</button>';
      btnHtml+=(t.act===false
        ?'<button class="btn bsm" title="Volver a activar esta tienda" onclick="sgnStorePausa('+t.id+',true)">Reactivar</button>'
        :'<button class="btn bsm" title="Pausar: la tienda deja de aparecer en el panel y en los conteos (p. ej. se retiro de Fenix)" onclick="sgnStorePausa('+t.id+',false)">Pausar</button>');
    }
    if(t.act===false)rowCls+=' pausada';
    rows+='<tr class="'+rowCls+'">'
      +'<td><div class="tname"><div class="pbar '+pbarCls+'"></div><span class="tntext">'+sgnEsc(t.n)+'</span>'+urgTag+noteTag+'</div></td>'
      +'<td><span class="badge bgr">'+sgnEsc(t.cat)+'</span></td>'
      +'<td>'+paisLabel+'</td>'
      +'<td style="'+regColor+'">'+(t.reg||'&#x2014;')+'</td>'
      +'<td style="color:var(--t3)">&#x2014;</td>'
      +'<td><span class="badge '+estBadge+'">'+t.est+'</span></td>'
      +'<td><div class="acts">'+btnHtml+'</div></td>'
      +'</tr>';
  });
  tbody.innerHTML=rows;
  var legend=document.getElementById('tlegend');
  if(legend)legend.innerHTML='<div class="li">Datos sincronizados desde Dropi cada 10 minutos.</div>';
};

// ── guardar v3: payload completo para Dropi ──
guardar = async function(){
  if(!SGN.curOrd||!gAc)return;
  var n=SGN.curOrd;
  var acMap={ok:'contacto',no:'sin_contacto',rev:'en_revision',dev:'devolucion',cas:'cas'};
  var comentario=null,nota=null,motivo=null,solucion=null,suf=null;
  if(gAc==='ok'){suf='ok';solucion=document.getElementById('sd-ok').value.trim();comentario=document.getElementById('cm-ok').value.trim()||null;}
  if(gAc==='no')comentario=document.getElementById('cm-no').value.trim();
  if(gAc==='cas')comentario=document.getElementById('cm-cas').value.trim();
  if(gAc==='rev')nota=['Cliente aun no define fecha de entrega','Falta un dato de direccion','Se espera respuesta del dropshipper'][gNt-1]||null;
  if(gAc==='dev'){suf='dev';motivo=document.getElementById('gmot').value;solucion=document.getElementById('sd-dev').value.trim();}
  var b=document.getElementById('bguard');
  if(b){b.disabled=true;b.textContent='Guardando...';}

  var payload=null,resolved=null;
  if(suf){
    function val(id){var e=document.getElementById(id);return e?e.value.trim():'';}
    payload={
      solution: solucion||'',
      direccionConfirma: val('dc-'+suf)||n.direccion_corregida||n.direccion_actual||'',
      nombreConfirma: val('nc-'+suf)||n.client_name||'',
      selectValueConfirma: val('sv-'+suf)||'1'
    };
  }
  if(SGN.resolveEnDropi&&suf){
    resolved=await sgnFn('resolve-novedad',{
      order_id:n.order_id,variante:n.variante||'C',
      solution_text:solucion||'',
      solution_payload:payload
    });
    if(!(resolved&&resolved.ok)){
      var det=resolved&&resolved.dropi?(' Respuesta Dropi: '+JSON.stringify(resolved.dropi).slice(0,300)):'';
      alert('No se pudo aplicar la resolucion en Dropi: '+((resolved&&resolved.error)||'error')+det+'\n\nLa gestion quedara registrada igualmente, pero la novedad sigue abierta en Dropi.');
    }
  }

  var g=await SGN.client.from('gestiones').insert({
    order_id:n.order_id,store_name:n.store_name,agente_id:SGN.profile.id,
    accion:acMap[gAc],comentario:comentario,nota_revision:nota,motivo_devolucion:motivo,
    solucion_dropi:solucion,variante:n.variante,solution_payload:payload,
    resolved_in_dropi:resolved?!!resolved.ok:null
  });
  if(g.error){
    alert('Error al guardar la gestion: '+g.error.message);
    if(b){b.disabled=false;b.innerHTML='&#x2713; Guardar gestion';}
    return;
  }
  var resolvioOk=suf?(resolved&&resolved.ok):false;
  var nuevo=gAc==='rev'?'en_revision':gAc==='cas'?'cas_abierto':(gAc==='ok'||gAc==='dev')?(SGN.resolveEnDropi&&!resolvioOk?'pendiente':'resuelta'):'pendiente';
  await SGN.client.from('novedades').update({intentos:(n.intentos||0)+1,estado_local:nuevo,assigned_to:null}).eq('order_id',n.order_id);
  n.intentos=(n.intentos||0)+1;n.estado_local=nuevo;
  sgnBuildTiendas();
  closeMo('mog');setTimeout(function(){goPage('conf');},200);
};

// ── panel Analizar: metricas reales de la tienda ──
async function sgnRenderAnl(){
  var el=document.getElementById('panl');if(!el)return;
  var t=null;TIENDAS.forEach(function(x){if(x.id===SGN.curStoreId)t=x;});
  if(!t){el.innerHTML='<div class="pt">Analisis de tienda</div><div class="ps">Selecciona una tienda desde el modulo Tiendas (boton Analizar).</div>';return;}
  el.innerHTML='<div class="pt">Analisis — '+sgnEsc(t.n)+'</div><div class="ps">Cargando metricas...</div>';
  var r=await SGN.client.from('novedades')
    .select('order_id,tipo_novedad,estado_local,producto,ciudad,broker_created_at,first_synced_at')
    .eq('store_id',t.id).limit(5000);
  SGN.anlNovs=r.data||[];
  // canal de solucion por orden (Dropi vs Interno), derivado de gestiones
  SGN.anlCanal={};
  var rg=await SGN.client.from('gestiones').select('order_id,solution_payload').eq('store_name',t.n).limit(8000);
  (rg.data||[]).forEach(function(g){
    var isDropi=!!(g.solution_payload&&g.solution_payload.tipo_solucion);
    if(isDropi)SGN.anlCanal[g.order_id]='Dropi';
    else if(SGN.anlCanal[g.order_id]!=='Dropi')SGN.anlCanal[g.order_id]='Interno';
  });
  var prods=[];var ciudades=[];
  SGN.anlNovs.forEach(function(n){
    if(n.producto&&prods.indexOf(n.producto)===-1)prods.push(n.producto);
    if(n.ciudad&&ciudades.indexOf(n.ciudad)===-1)ciudades.push(n.ciudad);
  });
  prods.sort();ciudades.sort();
  function opts(list,lbl){var h='<option value="">'+lbl+'</option>';list.forEach(function(v){h+='<option>'+sgnEsc(v)+'</option>';});return h;}
  var sinDatosExtra=(!prods.length&&!ciudades.length)
    ?'<div class="al an" style="font-size:12px;margin-bottom:12px">&#x2139; El broker de Fenix aun no envia <strong>producto</strong> ni <strong>ciudad</strong>. La plataforma ya esta lista para recibirlos: cuando Fenix agregue esos campos al API, los filtros se activaran solos.</div>':'';
  var comments=sgnStoreComments(t.id);
  var commentRows='';
  comments.forEach(function(c){
    var quien=(c.profiles&&c.profiles.full_name)?c.profiles.full_name:'—';
    var f=new Date(c.created_at).toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'2-digit'});
    commentRows+='<div style="display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--bdr)">'
      +'<span style="flex-shrink:0">&#x1F4CC;</span>'
      +'<div style="flex:1"><div style="font-size:13px;color:var(--tx)">'+sgnEsc(c.texto)+'</div>'
      +'<div style="font-size:10.5px;color:var(--t3);margin-top:2px">'+sgnEsc(quien)+' &middot; '+f+'</div></div>'
      +'<button class="btn br2 bsm" onclick="sgnDelComment('+c.id+')">Quitar</button></div>';
  });
  if(!commentRows)commentRows='<p style="font-size:12px;color:var(--t3);font-style:italic;padding:6px 0">Sin notas especiales. Lo que escribas aqui lo vera el equipo al gestionar novedades de esta tienda.</p>';
  el.innerHTML=
    '<div class="crumb"><a onclick="goPage(\'tiendas\')">&#x2190; Tiendas</a><span>/</span><span class="cur">'+sgnEsc(t.n)+'</span><span class="badge bn">'+(PAIS_NOMBRE[t.pais]||t.pais)+'</span>'+(t.urg?'<span class="utag">&#x1F6A9; Urgente</span>':'')+'</div>'
    +sinDatosExtra
    +'<div class="card cb" style="margin-bottom:14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
    +'<span style="font-size:12px;font-weight:600;color:var(--t2)">Filtros:</span>'
    +'<select id="anl-prod" onchange="sgnAnlApply()" '+(prods.length?'':'disabled')+' style="font-size:12px;padding:6px 10px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit">'+opts(prods,prods.length?'Todos los productos':'Producto (sin datos aun)')+'</select>'
    +'<select id="anl-ciudad" onchange="sgnAnlApply()" '+(ciudades.length?'':'disabled')+' style="font-size:12px;padding:6px 10px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit">'+opts(ciudades,ciudades.length?'Todas las ciudades':'Ciudad (sin datos aun)')+'</select>'
    +'<select id="anl-estado" onchange="sgnAnlApply()" style="font-size:12px;padding:6px 10px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit"><option value="">Todos los estados</option><option value="pendiente">Pendientes</option><option value="en_revision">En revision</option><option value="cas_abierto">CAS</option><option value="resuelta">Resueltas por el equipo</option><option value="cerrada_broker">Cerradas en Dropi</option></select>'
    +'<select id="anl-tiposol" onchange="sgnAnlApply()" style="font-size:12px;padding:6px 10px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit"><option value="">Tipo de solucion: todas</option><option value="Dropi">&#x1F7E2; Solucion en Dropi</option><option value="Interno">&#x26AA; Registro interno</option></select>'
    +'</div></div>'
    +'<div class="sg" id="anl-stats" style="margin-bottom:14px"></div>'
    +'<div class="tc" style="margin-bottom:15px">'
    +'<div class="card cb"><div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--bdr)">Causales mas frecuentes</div><div id="anl-causales"></div></div>'
    +'<div class="card cb"><div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--bdr)">Distribucion por estado</div><div id="anl-estados"></div></div>'
    +'</div>'
    +'<div class="card cb"><div style="font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px;padding-bottom:9px;border-bottom:1px solid var(--bdr)">&#x1F4CC; Notas especiales de la tienda</div>'
    +'<div id="anl-comments">'+commentRows+'</div>'
    +'<div style="display:flex;gap:7px;margin-top:11px"><input type="text" id="anl-newcomment" placeholder="Ej: Esta tienda autoriza reprogramar hasta 2 veces antes de devolver..." style="flex:1;font-size:12.5px;padding:8px 11px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit"><button class="btn bp bsm" onclick="sgnAddComment('+t.id+')">+ Agregar nota</button></div>'
    +'</div>';
  sgnAnlApply();
}
function sgnAnlApply(){
  var prod=document.getElementById('anl-prod')?document.getElementById('anl-prod').value:'';
  var ciu=document.getElementById('anl-ciudad')?document.getElementById('anl-ciudad').value:'';
  var est=document.getElementById('anl-estado')?document.getElementById('anl-estado').value:'';
  var ts=document.getElementById('anl-tiposol')?document.getElementById('anl-tiposol').value:'';
  var canalMap=SGN.anlCanal||{};
  var novs=SGN.anlNovs.filter(function(n){
    if(prod&&n.producto!==prod)return false;
    if(ciu&&n.ciudad!==ciu)return false;
    if(est&&n.estado_local!==est)return false;
    if(ts&&(canalMap[n.order_id]||'')!==ts)return false;
    return true;
  });
  var total=novs.length,act=0,res=0,cer=0,cas=0;
  var causales={},estados={};
  novs.forEach(function(n){
    if(n.estado_local==='pendiente'||n.estado_local==='en_revision')act++;
    else if(n.estado_local==='cas_abierto'){act++;cas++;}
    else if(n.estado_local==='resuelta')res++;
    else if(n.estado_local==='cerrada_broker')cer++;
    var c=n.tipo_novedad||'Sin causal';
    causales[c]=(causales[c]||0)+1;
    estados[n.estado_local]=(estados[n.estado_local]||0)+1;
  });
  var stats=document.getElementById('anl-stats');
  if(stats)stats.innerHTML=
    '<div class="sc"><div class="sn">'+total+'</div><div class="sl">Novedades (historico)</div></div>'
    +'<div class="sc" style="border-top:2px solid var(--amb)"><div class="sn" style="color:var(--amb)">'+act+'</div><div class="sl">Activas</div></div>'
    +'<div class="sc" style="border-top:2px solid var(--grn)"><div class="sn" style="color:var(--grn)">'+res+'</div><div class="sl">Resueltas por el equipo</div></div>'
    +'<div class="sc" style="border-top:2px solid var(--navy)"><div class="sn" style="color:var(--navy)">'+cer+'</div><div class="sl">Cerradas en Dropi</div></div>';
  var colores=['var(--red)','var(--gold)','var(--navy)','var(--grn)','var(--amb)','var(--t3)','var(--red)','var(--gold)'];
  var top=Object.keys(causales).map(function(k){return [k,causales[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,8);
  var mx=top.length?top[0][1]:1;
  var ch='';
  top.forEach(function(c,i){
    var pct=total?Math.round(c[1]/total*100):0;
    ch+='<div class="crl"><span class="crln" title="'+sgnEsc(c[0])+'">'+sgnEsc(c[0].length>34?c[0].slice(0,32)+'…':c[0])+'</span><div class="crlbw"><div class="crlf" style="width:'+Math.round(c[1]/mx*100)+'%;background:'+colores[i%colores.length]+'"></div></div><span class="crlp">'+c[1]+' ('+pct+'%)</span></div>';
  });
  var elC=document.getElementById('anl-causales');
  if(elC)elC.innerHTML=ch||'<p style="font-size:12px;color:var(--t3);font-style:italic">Sin datos con estos filtros.</p>';
  var lblEst={pendiente:'Pendiente',en_revision:'En revision',cas_abierto:'CAS abierto',resuelta:'Resuelta (equipo)',cerrada_broker:'Cerrada en Dropi'};
  var colEst={pendiente:'var(--amb)',en_revision:'var(--navy)',cas_abierto:'var(--red)',resuelta:'var(--grn)',cerrada_broker:'var(--t3)'};
  var eh='';
  Object.keys(estados).forEach(function(k){
    var pct=total?Math.round(estados[k]/total*100):0;
    eh+='<div class="crl"><span class="crln">'+(lblEst[k]||k)+'</span><div class="crlbw"><div class="crlf" style="width:'+pct+'%;background:'+(colEst[k]||'var(--navy)')+'"></div></div><span class="crlp">'+estados[k]+' ('+pct+'%)</span></div>';
  });
  var elE=document.getElementById('anl-estados');
  if(elE)elE.innerHTML=eh||'<p style="font-size:12px;color:var(--t3);font-style:italic">Sin datos con estos filtros.</p>';
}
async function sgnAddComment(storeId){
  var inp=document.getElementById('anl-newcomment');
  var texto=(inp.value||'').trim();
  if(!texto){alert('Escribe la nota antes de agregarla.');return;}
  var r=await SGN.client.from('store_comments').insert({store_id:storeId,autor_id:SGN.profile.id,texto:texto});
  if(r.error){alert('Error: '+r.error.message);return;}
  await sgnLoadComments();
  sgnRenderAnl();
}
async function sgnDelComment(id){
  var r=await SGN.client.from('store_comments').update({activo:false}).eq('id',id);
  if(r.error){alert('Error: '+r.error.message);return;}
  await sgnLoadComments();
  sgnRenderAnl();
}

</script>
<script>
// ════════════════════════════════════════════════════════════
// SGN · V3.1: claridad sobre qué acciones resuelven en Dropi
// ════════════════════════════════════════════════════════════
// Etiquetas en los botones del modal
var sgnGestV3 = sgnGest;
sgnGest = function(orderId){
  sgnGestV3(orderId);
  ['ok','dev'].forEach(function(s){
    var b=document.getElementById('ab-'+s);
    if(b && b.innerHTML.indexOf('Resuelve en Dropi')===-1){
      b.innerHTML+='<span style="display:block;font-size:9px;font-weight:700;color:var(--grn);margin-top:3px;letter-spacing:.03em">&#x2713; RESUELVE EN DROPI</span>';
    }
  });
  ['no','rev','cas'].forEach(function(s){
    var b=document.getElementById('ab-'+s);
    if(b && b.innerHTML.indexOf('Solo registro')===-1){
      b.innerHTML+='<span style="display:block;font-size:9px;font-weight:600;color:var(--t3);margin-top:3px;letter-spacing:.03em">Solo registro interno</span>';
    }
  });
};

// Avisos claros al seleccionar la acción
selAc = function(t){
  gAc=t;gNt=null;
  document.querySelectorAll('.ab').forEach(function(b){b.classList.remove('sel');});
  var ab=document.getElementById('ab-'+t);if(ab)ab.classList.add('sel');
  ['ok','no','rev','dev','cas'].forEach(function(z){var e=document.getElementById('z-'+z);if(e)e.style.display='none';});
  var gal=document.getElementById('gal');
  if(gal)gal.innerHTML='';
  document.querySelectorAll('.nbt').forEach(function(b){b.classList.remove('sel');});
  var map={ok:'z-ok',no:'z-no',rev:'z-rev',dev:'z-dev',cas:'z-cas'};
  if(map[t]){var e=document.getElementById(map[t]);if(e)e.style.display=t==='dev'?'flex':'block';}
  if(gal){
    if(t==='ok')gal.innerHTML='<div class="al an" style="font-size:12px">&#x2705; <strong>Esta accion aplicara la solucion REAL en Dropi</strong> al guardar. Completa la solucion y los datos que Dropi exige.</div>';
    if(t==='dev')gal.innerHTML='<div class="al an" style="font-size:12px">&#x2705; <strong>La devolucion se registrara en Dropi</strong> al guardar. Selecciona el motivo y escribe la solucion.</div>';
    if(t==='no')gal.innerHTML='<div class="al ag" style="font-size:12px">&#x26A0; <strong>"Sin contacto" NO resuelve la novedad en Dropi</strong>: solo registra el intento internamente y suma 1 al contador. Si hablaste con el cliente y hay solucion, usa <strong>Contacto con cliente</strong>.</div>';
    if(t==='rev')gal.innerHTML='<div class="al ag" style="font-size:12px">&#x1F550; Registro interno: la novedad queda "En revision". No se envia nada a Dropi.</div>';
    if(t==='cas')gal.innerHTML='<div class="al ag" style="font-size:12px">&#x1F4CB; Registro interno: se abre un CAS. No se envia nada a Dropi.</div>';
  }
  updB();
};

</script>
<script>
// ════════════════════════════════════════════════════════════

var gSol = null; // 'none' | 'reoffer' | 'return' | 'opcion'
var gOpcion=null, gOpcionLabel=null, gOpcionReq=[], gNeedConfirm=false;

sgnGest = function(orderId){
  var n=null;SGN.novedades.forEach(function(x){if(x.order_id===orderId)n=x;});
  if(!n)return;

  if(n.assigned_to&&n.assigned_to!==SGN.profile.id){
    if(!confirm('🔒 Esta novedad la esta gestionando otro agente en este momento.\n\nSi continuas, quedara asignada a ti. Cancela si prefieres no interferir.'))return;
  }
  SGN.curOrd=n;
  // Marcar "en gestion" por este agente (bloqueo suave)
  if(n.assigned_to!==SGN.profile.id){
    n.assigned_to=SGN.profile.id;
    SGN.client.from('novedades').update({assigned_to:SGN.profile.id}).eq('order_id',n.order_id).then(function(){},function(){});
  }
  openGest(n.order_id,(n.tipo_novedad||'').replace(/'/g,''),n.client_name||'—',n.phone||'',PAIS_NOMBRE[n.country]||n.country||'','Regular',Math.min(3,(n.intentos||0)+1));
  sgnHistorial(n.order_id);
  sgnModalComment();
};

openGest = function(id,ca,cl,tel,pa,tp,inp){

    mapsBtn='<div class="al an" style="font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:55%"><div>&#x1F4CD; '+sgnEsc(n.direccion_actual||'—')+'</div><div style="font-size:11px;color:var(--t2);margin-top:3px">Ciudad: '+sgnEsc(n.ciudad||'—')+' &middot; Departamento: '+sgnEsc(n.departamento||'—')+'</div></div><button class="btn bsm" style="flex-shrink:0" onclick="window.open(\'https://www.google.com/maps/search/?api=1&query='+mq+'\',\'_blank\')">Verificar en Maps</button></div>';
  }
  var motOpts='<option value="">Selecciona el motivo...</option>';
  (SGN.motivos.length?SGN.motivos:['Guia supero intentos de entrega','Devuelto ciudad de destino errada','Devuelto 3 intentos de gestion','Numero equivocado']).forEach(function(m){motOpts+='<option>'+sgnEsc(m)+'</option>';});
  function cap(txt,col){return '<span style="display:block;font-size:9px;font-weight:700;color:'+col+';margin-top:3px;letter-spacing:.03em">'+txt+'</span>';}
  var inputStyle='font-size:12.5px;padding:7px 11px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit;width:100%;margin-top:3px';
  document.getElementById('mogc').innerHTML=
    '<div class="mh"><div class="mt">Gestionar novedad <span style="font-size:11px;background:rgba(255,208,48,.25);color:#FFD030;padding:2px 8px;border-radius:20px;margin-left:5px;font-weight:500">'+il+'</span></div><button class="mc" onclick="closeMo(\'mog\')">&#xD7;</button></div>'
    +'<div class="mb">'
    +'<div class="ig"><div class="ii"><div class="il">Orden</div><div class="iv" style="font-family:monospace">#'+sgnEsc(id)+'</div></div><div class="ii"><div class="il">Tipo</div><div class="iv"><span class="rtag">&#x2713; Regular</span></div></div><div class="ii"><div class="il">Causal</div><div class="iv" style="font-size:12px">'+sgnEsc(ca)+'</div></div><div class="ii"><div class="il">Cliente</div><div class="iv">'+sgnEsc(cl)+'</div></div><div class="ii"><div class="il">Producto</div><div class="iv" style="font-size:12px">'+sgnEsc((SGN.curOrd&&SGN.curOrd.producto)||'\u2014')+'</div></div><div class="ii"><div class="il">Guia</div><div class="iv" style="font-family:monospace;font-size:12px">'+sgnEsc((SGN.curOrd&&SGN.curOrd.guia_envio)||'\u2014')+'</div></div><div class="ii"><div class="il">Transportadora</div><div class="iv" style="font-size:12px">'+sgnEsc((SGN.curOrd&&SGN.curOrd.transportadora)||'\u2014')+'</div></div></div>'
    +'<div class="tel-card"><div><div class="tellbl">&#x1F4F1; Numero de celular</div><div class="telnum" id="gtel">'+sgnEsc(tel)+'</div><div class="telpais">'+sgnEsc(pa)+'</div></div>'
    +'<div class="telbts">'
    +'<button class="telbt tcall" onclick="window.location.href=\'tel:\'+document.getElementById(\'gtel\').textContent.replace(/\\s/g,\'\')">&#x1F4DE; Llamar</button>'
    +'<button class="telbt" style="background:#E7F7EC;color:#128C7E;border:1px solid rgba(18,140,126,.2)" onclick="openWA()">&#x1F4AC; WhatsApp</button>'
    +'<button class="telbt tcopy" id="cbtn" onclick="copyT()">&#x1F4CB; Copiar</button>'
    +'</div></div>'
    +mapsBtn
    +'<div><div style="font-size:11.5px;font-weight:500;color:var(--t2);margin-bottom:8px">Que ocurrio en esta gestion? <span style="color:var(--t3);font-weight:400">(registro interno)</span></div>'
    +'<div class="ag-grid">'
    +'<button class="ab" id="ab-ok" onclick="selAc(\'ok\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 014.49 13.8 19.79 19.79 0 011.43 5.23 2 2 0 013.41 3h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L7.91 10.9a16 16 0 006.29 6.29l1.06-1.06a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 18.19z"/></svg>Contacto con cliente'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'<button class="ab" id="ab-no" onclick="selAc(\'no\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7 2 2 0 011.72 2v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.34 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>Sin contacto'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'<button class="ab" id="ab-rev" onclick="selAc(\'rev\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>En revision'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'<button class="ab" id="ab-dev" onclick="selAc(\'dev\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>Devolver al remitente'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'<button class="ab" id="ab-cas" onclick="selAc(\'cas\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Abrir CAS'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'<button class="ab" id="ab-tr" onclick="selTr()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Solucionada por transportadora'+cap('REGISTRO INTERNO','var(--t3)')+'</button>'
    +'</div></div>'
    +'<div id="gal"></div>'

    // ── NOTAS INTERNAS (puro registro, sin Dropi) ──
    +'<div id="z-ok" style="display:none"><div class="fld"><label>Comentario <span class="req">Obligatorio</span> <span style="font-size:10.5px;color:var(--t3);font-weight:400">(nota interna: que se hablo en la llamada)</span></label><textarea id="cm-ok" placeholder="Ej: Cliente confirma que si recibira el pedido, se aclara la direccion..." oninput="updB()"></textarea></div></div>'
    +'<div id="z-no" style="display:none"><div class="fld"><label>Comentario <span class="req">Obligatorio</span> <span style="font-size:10.5px;color:var(--t3);font-weight:400">(nota interna del intento)</span></label><textarea id="cm-no" placeholder="Contexto del intento (no contesto, buzon, etc.)..." oninput="updB()"></textarea></div></div>'
    +'<div id="z-rev" style="display:none"><div class="fld"><label>Motivo de revision</label><div style="display:flex;flex-direction:column;gap:5px;margin-top:5px"><button class="nbt" id="nb1" onclick="selNt(1)">&#x1F550; Cliente aun no define fecha de entrega</button><button class="nbt" id="nb2" onclick="selNt(2)">&#x1F4CD; Falta un dato de direccion</button><button class="nbt" id="nb3" onclick="selNt(3)">&#x1F464; Se espera respuesta del dropshipper</button></div></div></div>'
    +'<div id="z-dev" style="display:none"><div class="fld"><label>Motivo de devolucion <span style="font-size:10.5px;color:var(--t3);font-weight:400">(se ve en la lista con el ojito, sin descargar el reporte)</span></label><select id="gDevMot" onchange="updB()" style="font-size:12.5px;padding:7px 11px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit;width:100%;margin-top:3px">'+motOpts+'</select></div><div class="fld" style="margin-top:9px"><label>Nota interna <span style="font-size:10.5px;color:var(--t3);font-weight:400">(opcional)</span></label><textarea id="cm-dev" placeholder="Contexto para el equipo..." oninput="updB()"></textarea></div></div>'
    +'<div id="z-cas" style="display:none"><div class="fld"><label>Descripcion del CAS <span class="req">Obligatorio</span></label><textarea id="cm-cas" placeholder="Describe el motivo del CAS..." oninput="updB()"></textarea></div></div>'

    // ── SOLUCION DROPI (seccion independiente; obligatoria solo para Contacto/Sin contacto/Devolver) ──
    +'<div id="z-soldropi" style="display:none">'
    +'<div style="font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:15px 0 7px;padding-top:13px;border-top:1px dashed var(--bdr2)">&#x1F4E6; Solucion Dropi <span style="font-weight:400;color:var(--t3);text-transform:none;letter-spacing:0">(obligatoria para cerrar esta novedad en Dropi)</span></div>'
    +'<button class="nbt" id="sol-cargar" onclick="sgnCargarOpciones()" style="border-color:var(--navy);color:var(--navy);font-weight:600;margin-bottom:5px">&#x1F504; Recargar opciones reales de Dropi</button>'
    +'<div id="z-sol-opciones" style="display:none;margin-bottom:8px"></div>'
    +'<div id="z-sol-nomenu" style="display:none"></div>'
    +'</div>'
    +'<div style="margin:14px 0 4px;padding-top:13px;border-top:1px dashed var(--bdr2)"><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--tx);cursor:pointer"><input type="checkbox" id="aud-chk" onchange="sgnAudToggle();updB()" style="width:16px;height:16px;cursor:pointer"> &#x1F50D; Auditoria <span style="font-weight:400;color:var(--t3);font-size:11px">(opcional)</span></label></div>'
    +'<div id="z-aud" style="display:none;margin-top:8px">'
    +'<div class="fld"><label>Tipo de auditoria</label><select id="aud-tipo" style="'+inputStyle+'"><option value="agente">Agente</option><option value="proveedor">Proveedor</option><option value="transportadora">Transportadora</option><option value="producto">Producto</option></select></div>'
    +'<div class="fld" style="margin-top:9px"><label>Comentario <span class="req">Obligatorio</span></label><textarea id="aud-com" placeholder="Detalle de la auditoria (obligatorio si marcas auditoria)..." oninput="updB()"></textarea></div>'
    +'</div>'
    +'<div><div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px">Historial de gestiones</div><p style="font-size:12px;color:var(--t3);font-style:italic">Cargando historial...</p></div>'
    +'</div>'
    +'<div class="mf"><button class="btn bsm" onclick="closeMo(\'mog\')">Cancelar</button><button class="btn bp bsm" id="bguard" disabled onclick="guardar()" style="padding:6px 16px">&#x2713; Guardar gestion</button></div>';
  document.getElementById('mog').classList.add('open');
};

// Notas internas que EXIGEN una solucion aplicada en Dropi para poder guardar.
var DROPI_REQ={ok:1,no:1,dev:1};
// Auditoria (opcional): muestra/oculta el bloque de tipo + comentario
sgnAudToggle = function(){var c=document.getElementById('aud-chk'),z=document.getElementById('z-aud');if(z)z.style.display=(c&&c.checked)?'block':'none';};
selAc = function(t){
  gAc=t;gNt=null;gSol=null;gOpcion=null;gNeedConfirm=false;
  document.querySelectorAll('.ab').forEach(function(b){b.classList.remove('sel');});
  var ab=document.getElementById('ab-'+t);if(ab)ab.classList.add('sel');
  ['ok','no','rev','dev','cas'].forEach(function(z){var e=document.getElementById('z-'+z);if(e)e.style.display='none';});
  var zsd=document.getElementById('z-soldropi');if(zsd)zsd.style.display='none';
  var _snm=document.getElementById('z-sol-nomenu');if(_snm){_snm.style.display='none';_snm.innerHTML='';}
  var zso=document.getElementById('z-sol-opciones');if(zso){zso.style.display='none';zso.innerHTML='';}
  var gal=document.getElementById('gal');if(gal)gal.innerHTML='';
  document.querySelectorAll('#z-rev .nbt').forEach(function(b){b.classList.remove('sel');});
  var map={ok:'z-ok',no:'z-no',rev:'z-rev',dev:'z-dev',cas:'z-cas'};
  if(map[t]){var e=document.getElementById(map[t]);if(e)e.style.display='block';}
  var needDropi=!!DROPI_REQ[t];
  if(needDropi&&zsd){zsd.style.display='block';try{sgnCargarOpciones();}catch(e){}}
  if(gal){
    if(needDropi)gal.innerHTML='<div class="al an" style="font-size:12px">Registro interno + <strong>Solucion Dropi</strong>: elige una opcion real de Dropi. En Ecuador/Mexico (variante C/D) se resuelve directamente en Dropi.</div>';
    if(t==='rev')gal.innerHTML='<div class="al ag" style="font-size:12px">&#x1F550; Registro interno: la novedad queda "En revision" por el tiempo del proceso. No se envia nada a Dropi.</div>';
    if(t==='cas')gal.innerHTML='<div class="al ag" style="font-size:12px">&#x1F4CB; Registro interno: se abre un CAS. No se envia nada a Dropi.</div>';
  }
  updB();
};

selSol = function(t){
  gSol=t;gOpcion=null;
  var mb=document.getElementById('sol-manualdropi');if(mb)mb.classList.toggle('sel',t==='manual_dropi');
  document.querySelectorAll('#z-sol-opciones .nbt').forEach(function(b){b.classList.remove('sel');});
  var mf=document.getElementById('md-fields');if(mf)mf.style.display=(t==='manual_dropi')?'block':'none';
  updB();
}

// Fase 2: cargar el menu REAL de opciones de Dropi y resolver con la opcion elegida
sgnCargarOpciones = async function(){
  var cont=document.getElementById('z-sol-opciones');if(!cont||!SGN.curOrd)return;
  cont.style.display='block';
  cont.innerHTML='<p style="font-size:12px;color:var(--t3)">Cargando opciones de Dropi...</p>';
  var r=await sgnFn('quick-processor',{order_id:SGN.curOrd.order_id});
  if(!r||!r.ok){cont.innerHTML='<div class="al ag" style="font-size:12px">No se pudieron cargar las opciones de Dropi'+(r&&r.error?(' ('+sgnEsc(String(r.error))+')'):'')+'. Usa una opcion manual abajo.</div>';return;}
  var ops=r.opciones||[];SGN.curOpciones=ops;
  var nomenu=document.getElementById('z-sol-nomenu');if(nomenu){nomenu.style.display='none';nomenu.innerHTML='';}
  var manualBtn='<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--bdr2)"><div style="font-size:10.5px;color:var(--t3);margin-bottom:4px">Si ninguna opcion aplica (ej. devolucion que Dropi no permite por API):</div><button class="nbt" id="sol-manualdropi" onclick="selSol(\'manual_dropi\')">&#x1F512; La resuelvo directamente en Dropi</button><div id="md-fields" style="display:none;margin-top:9px"><div class="fld"><label>Nota de la gestion <span style="font-size:10px;color:var(--t3)">(opcional)</span></label><textarea id="md-nota" placeholder="Ej: Devolucion; se aplica en Dropi." oninput="updB()"></textarea></div></div></div>';
  if(!ops.length){cont.innerHTML='<div class="al ag" style="font-size:12px">Dropi no devolvio opciones para esta novedad.</div>'+manualBtn;return;}
  var html='<div style="font-size:11px;color:var(--t3);margin-bottom:6px">Opciones reales de Dropi'+(r.variante?(' &middot; variante '+sgnEsc(r.variante)):'')+':</div><div style="display:flex;flex-direction:column;gap:5px">';
  ops.forEach(function(o,i){html+='<button class="nbt" id="opc-'+i+'" onclick="selOpcionDropi('+i+')">'+sgnEsc(o.label||o.id)+(o.tipo?(' <span style="color:var(--t3);font-size:10px">('+sgnEsc(o.tipo)+')</span>'):'')+'</button>';});
  html+='</div><div id="z-sol-opcion-fields" style="display:none;margin-top:10px"></div>'+manualBtn;
  cont.innerHTML=html;
};
selOpcionDropi = function(i){
  var o=(SGN.curOpciones||[])[i];if(!o)return;
  gSol='opcion';gOpcion=o.id;gOpcionLabel=o.label||o.id;gOpcionReq=o.requiere||[];
  gNeedConfirm=(o.id==='devolucion_remitente')||((o.tipo==='devolucion')&&(o.id!=='sl_8'));
  (SGN.curOpciones||[]).forEach(function(_,j){var b=document.getElementById('opc-'+j);if(b)b.classList.toggle('sel',j===i);});
  var _mb=document.getElementById('sol-manualdropi');if(_mb)_mb.classList.remove('sel');var _mf=document.getElementById('md-fields');if(_mf)_mf.style.display='none';
  var needDir=gOpcionReq.indexOf('direccion_corregida')>-1;
  var st='font-size:12.5px;padding:7px 11px;border:1px solid var(--bdr2);border-radius:var(--rs);background:var(--sur);color:var(--tx);font-family:inherit;width:100%;margin-top:3px';
  var confHtml=gNeedConfirm?'<div class="al" style="margin-top:9px;background:#3a1414;border:1px solid var(--red);color:#ffd7d7;font-size:12px;border-radius:var(--rs);padding:9px"><strong>&#x26A0; Devolucion al remitente — IRREVERSIBLE.</strong> El paquete se regresa al remitente y no se puede deshacer.<label style="display:flex;align-items:center;gap:7px;margin-top:7px;cursor:pointer;color:#fff"><input type="checkbox" id="opc-confirm" onchange="updB()" style="width:auto"> Confirmo la devolucion al remitente</label></div>':'';
  var fz=document.getElementById('z-sol-opcion-fields');
  if(fz){fz.style.display='block';
    fz.innerHTML='<div class="fld"><label>Detalle / nota de la solucion <span class="req">Obligatorio</span></label><textarea id="opc-sol" placeholder="Ej: Cliente confirma, reintentar entrega" oninput="updB()"></textarea></div>'+(needDir?'<div class="fld" style="margin-top:9px"><label>Direccion corregida <span class="req">Obligatorio</span></label><input type="text" id="opc-dir" value="'+sgnEsc((SGN.curOrd&&(SGN.curOrd.direccion_corregida||SGN.curOrd.direccion_actual))||'')+'" oninput="updB()" style="'+st+'"></div>':'')+confHtml;
  }
  updB();
};

updB = function(){
  var b=document.getElementById('bguard');if(!b)return;
  function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
  if(!gAc){b.disabled=true;return;}
  var _ac=document.getElementById('aud-chk');
  if(_ac&&_ac.checked&&!v('aud-com')){b.disabled=true;return;}
  // 1) requisito de la nota interna
  var internoOk=true;
  if(gAc==='ok')internoOk=!!v('cm-ok');
  else if(gAc==='no')internoOk=!!v('cm-no');
  else if(gAc==='rev')internoOk=!!gNt;
  else if(gAc==='cas')internoOk=!!v('cm-cas');
  // 'dev': nota interna opcional
  if(!internoOk){b.disabled=true;return;}
  // 2) requisito de Solucion Dropi (solo Contacto/Sin contacto/Devolver)
  if(DROPI_REQ[gAc]){
    if(gSol==='opcion'&&gOpcion){var dirOk=(gOpcionReq.indexOf('direccion_corregida')===-1)||!!v('opc-dir');var cc=document.getElementById('opc-confirm');var confOk=!gNeedConfirm||(cc&&cc.checked);b.disabled=!(v('opc-sol')&&dirOk&&confOk);return;}
    if(gSol==='manual_dropi'){b.disabled=false;return;}
    b.disabled=true;return; // sin opcion real elegida -> no se puede guardar
  }
  // 3) rev/cas -> solo registro interno
  b.disabled=false;
};

guardar = async function(){
  if(!SGN.curOrd||!gAc)return;
  var n=SGN.curOrd;
  function v(id){var e=document.getElementById(id);return e?e.value.trim():'';}
  var _audc=document.getElementById('aud-chk');
  if(_audc&&_audc.checked&&!v('aud-com')){alert('La auditoria requiere un comentario. Escribe el detalle o desmarca la casilla de Auditoria.');return;}
  var acMap={ok:'contacto',no:'sin_contacto',rev:'en_revision',dev:'devolucion',cas:'cas'};
  var comentario=null,nota=null,motivo=null,solucion=null,payload=null,resolver=false;
  // nota interna segun la tarjeta
  if(gAc==='ok')comentario=v('cm-ok');
  if(gAc==='no')comentario=v('cm-no');
  if(gAc==='cas')comentario=v('cm-cas');
  if(gAc==='dev'){comentario=v('cm-dev')||null;motivo=v('gDevMot')||null;}
  if(gAc==='rev')nota=['Cliente aun no define fecha de entrega','Falta un dato de direccion','Se espera respuesta del dropshipper'][gNt-1]||null;
  // Solucion Dropi (campo independiente; solo Contacto/Sin contacto/Devolver la exigen)
  if(DROPI_REQ[gAc]){
    if(gSol==='opcion'&&gOpcion){
      solucion=v('opc-sol');resolver=true;
      payload={tipo_solucion:'opcion',opcion:gOpcion,label:gOpcionLabel,solution:solucion,direccion_corregida:v('opc-dir')||undefined,confirmacion:gNeedConfirm?'DEVOLVER':undefined};
    } else if(gSol==='manual_dropi'){
      solucion=v('md-nota')||'Gestion registrada; se resuelve directamente en Dropi';resolver=false;
    } else {
      alert('Elige una opcion real de Dropi. Si es Ecuador/Mexico (variante C/D), usa "Registrar gestion (la resuelvo en Dropi)".');
      return;
    }
  }
  var b=document.getElementById('bguard');
  if(b){b.disabled=true;b.textContent='Guardando...';}

  var resolved=null;
  if(SGN.resolveEnDropi&&resolver){
    resolved=await sgnFn('resolve-novedad',{
      order_id:n.order_id,variante:n.variante||'C',
      opcion:(payload&&payload.opcion)?payload.opcion:undefined,
      solution_text:solucion||'',
      direccion_corregida:(payload&&(payload.direccion_corregida||payload.direccionConfirma))||undefined,
      confirmacion:(payload&&payload.confirmacion)||undefined,
      solution_payload:payload
    });
    if(!(resolved&&resolved.ok)){
      var motivo=(resolved&&(resolved.reason||resolved.error))||'sin detalle';
      var soloManual=resolved&&(resolved.status===409||(resolved.dropi&&resolved.dropi.solo_manual));
      alert((soloManual?'🔒 Esta novedad SOLO se puede gestionar manualmente en Dropi (no por la plataforma).':'⚠️ Dropi NO aplico la solucion; la novedad queda PENDIENTE.')+'\n\nMotivo: '+motivo+'\n\nSe marco con "Verificar/cerrar en Dropi"; resuelvela directamente en Dropi.');
    }
  }

  var g=await SGN.client.from('gestiones').insert({
    order_id:n.order_id,store_name:n.store_name,agente_id:SGN.profile.id,
    accion:acMap[gAc],comentario:comentario,nota_revision:nota,motivo_devolucion:motivo,
    solucion_dropi:solucion,variante:n.variante,solution_payload:payload,
    resolved_in_dropi:resolver?(resolved?!!resolved.ok:null):null
  });
  if(g.error){
    alert('Error al guardar la gestion: '+g.error.message);
    if(b){b.disabled=false;b.innerHTML='&#x2713; Guardar gestion';}
    return;
  }
  // Auditoria opcional: si el agente la activo, se registra junto con la gestion
  var audChk=document.getElementById('aud-chk');
  if(audChk&&audChk.checked){
    var aTipo=(document.getElementById('aud-tipo')||{}).value||'agente';
    var aCom=(document.getElementById('aud-com')||{}).value||'';
    var ra=await SGN.client.from('auditorias').insert({order_id:n.order_id,store_name:n.store_name,tipo:aTipo,comentario:aCom,auditor_id:SGN.profile.id,auditor_nombre:SGN.profile.full_name||'',revisada:false});
    if(ra&&ra.error)console.warn('No se pudo guardar la auditoria:',ra.error.message);
  }
  var resolvioOk=resolver&&resolved&&resolved.ok;
  var nuevo=gAc==='rev'?'en_revision':gAc==='cas'?'cas_abierto':resolvioOk?'resuelta':'pendiente';
  var _needsRev=!!DROPI_REQ[gAc]&&!resolvioOk;
  await SGN.client.from('novedades').update({intentos:(n.intentos||0)+1,estado_local:nuevo,assigned_to:null,dropi_review:_needsRev}).eq('order_id',n.order_id);
  n.intentos=(n.intentos||0)+1;n.estado_local=nuevo;
  sgnBuildTiendas();
  closeMo('mog');setTimeout(function(){goPage('conf');},200);
};

</script>
